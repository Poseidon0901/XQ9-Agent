[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "S",
    "RUF",
]
ignore = [
    "BLE001",
    "S110",
    "S112",
    "E501",

[tool.ruff.lint.per-file-ignores]
"tools/__init__.py" = ["F401"]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true